name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-fund --no-audit
      # check = data, build, lint (warnings denied), typecheck, tests,
      # content-free event verification, walkthrough fixture and formatting.
      - run: npm run check
      # The generated catalog is intentionally not a tracked file. Assert that
      # the build did not leave one behind instead of diffing an absent path.
      - run: "test ! -e dist/data.js && echo 'PASS: no generated catalog file in dist'"
      - run: npm audit --audit-level=low
      # Merging a red revision is blocked by GitHub branch protection.
      # Blocking a Vercel deployment on this check is a project setting and
      # remains an explicit owner action (docs/plan/backlog.md MTH-010).
